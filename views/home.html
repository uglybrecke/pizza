<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thatsa Pizza</title>
    <!-- Favicon -->
    <link rel="icon" href="/images/pizza_favicon.png">
    <!-- CSS -->
    <link rel="Stylesheet" href="/styles/pizza-styles.css">
    <!-- JavaScript, defered to after the page loads -->
     <script src="scripts/pizza.js" defer></script>
</head>
<body>
    <main>
        <div id="header">
            <img src="/images/pizzaguy.png" alt="supreme slice of pizza with logo thatza pizza and slogan">
            <h1>THATza PIZZA</h1>
            <h2>thanks for THAT!</h2>
            <hr>
            <p>we make great pizza!</p>
            <a id="contact-button" href="/contact" role="button">Contact Us</a>
        </div>
        <!-- post is more secure because it doesn't go through the url -->
        <form id="pizza-form" action="/submit-order" method="post"> 
            <!-- Contact Info  -->
            <fieldset>
                <legend>Contact Info</legend>

                <label for="fname">First Name:</label>
                <span class="err" id="err-fname">First name is required</span>
                <input type="text" id="fname" name="fname">

                <label for="lname">Last Name:</label>
                <span class="err" id="err-lname">Last name is required</span>
                <input type="text" id="lname" name="lname">

                <label for="email">Email:</label>
                <span class="err" id="err-email">Email is required</span>
                <input type="email" id="email" name="email">

            </fieldset>
            <fieldset>
                <legend>Select Pickup or Delivery</legend>
                <!-- same name for these makes them so you can't select both -->
                <span class="err" id="err-method">Select Pickup or Delivery</span>
                    <input type="radio" id="delivery" name="method" value="delivery">
                    <label for="delivery">Delivery</label>

                    <input type="radio" id="pickup" name="method" value="pickup">
                    <label for="pickup">Pick Up</label>
                
            </fieldset>
                        <!-- Toppings -->
            <fieldset>
                <legend>Select Toppings</legend>
                <label for="pepperoni">
                    <input type="checkbox" id="pepperoni" name="toppings[]"
                           value="pepperoni">Pepperoni
                </label>
                <label for="pineapple">
                    <input type="checkbox" id="pineapple" name="toppings[]"
                           value="pineapple">Pineapple
                </label>
            </fieldset>

            <!-- Pizza Size -->
            <fieldset>
                <legend>Pizza Size</legend>
                <span class="err" id="err-size">Select Pizza Size</span>
                    <select id="size" name="size">
                        <option value="none">-- Select a Size --</option>
                        <option value="small">Small</option>
                        <option value="medium">Medium</option>
                        <option value="large">Large</option>
                    </select>
                

            </fieldset>

            <!-- Comment field -->
            <label for="comment">Comments:</label>
            <textarea rows="5" id="comment" name="comment"></textarea>
            
            <!-- Add an Order button -->
            <button type="submit" id="order-button">Place Order</button>
        </form>
            
    </main>
</body>
</html>
